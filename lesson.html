            --primary-dark: #157347;
            --light-green: #e8f5ee;
            --dark-bg: #18211e;
            --page-bg: #f7f9f8;

        * {
            box-sizing: border-box;
        }

           NAVBAR

        .navbar {

            font-weight: 800;
            letter-spacing: .3px;
        }

        .navbar-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            margin-right: 8px;
        }

        .navbar .nav-link {
            color: rgba(255,255,255,.9) !important;
            font-weight: 600;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #fff !important;
        }

        /* =====================================================
           COURSE HEADER
        ===================================================== */

        .lesson-header {
            background: #fff;
            border-radius: 18px;
            padding: 24px;
            margin-top: 30px;
            margin-bottom: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }

        .course-badge {
            display: inline-block;
            background: var(--light-green);
            color: var(--primary);
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .lesson-header h1 {
            font-size: 30px;
            font-weight: 800;
            margin: 0 0 6px;
        }

        .lesson-header p {
            margin: 0;
            color: #6c757d;
        }

        .course-header-image {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #e5e5e5;
            background: #fff;
            flex-shrink: 0;
        }

        /* =====================================================
           VIDEO CARDS
        ===================================================== */

        .video-card {
            background: #fff;
            border: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0,0,0,.07);
            height: 100%;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .video-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,.12);
        }

        /* =====================================================
           VIDEO THUMBNAIL
        ===================================================== */

        .video-area {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }

        .video-thumbnail {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition: transform .35s ease;
        }

        .video-area:hover .video-thumbnail {
            transform: scale(1.025);
        }

        .thumbnail-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.12);
            transition: background .2s ease;
            pointer-events: none;
        }

        .video-area:hover .thumbnail-overlay {
            background: rgba(0,0,0,.28);
        }

        /* =====================================================
           PLAY BUTTON
        ===================================================== */

        .youtube-play {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 70px;
            height: 50px;

            background: #ff0000;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 8px 25px rgba(0,0,0,.35);

            transition:
                transform .2s ease,
                background .2s ease;

            pointer-events: none;
        }

        .youtube-play::before {
            content: "";

            width: 0;
            height: 0;

            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #fff;

            margin-left: 4px;
        }

        .video-area:hover .youtube-play {
            transform: translate(-50%, -50%) scale(1.08);
            background: #e00000;
        }

        .video-area:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        /* =====================================================
           LESSON NUMBER
        ===================================================== */

        .lesson-number {
            position: absolute;
            top: 12px;
            left: 12px;

            background: var(--primary);
            color: #fff;

            padding: 6px 11px;
            border-radius: 20px;

            font-size: 11px;
            font-weight: 800;

            z-index: 5;
        }

        /* =====================================================
           FREE BADGE
        ===================================================== */

        .free-badge {
            position: absolute;
            top: 12px;
            right: 12px;

            background: #fd7e14;
            color: #fff;

            padding: 6px 11px;
            border-radius: 20px;

            font-size: 10px;
            font-weight: 800;

            z-index: 5;
        }

        /* =====================================================
           NO VIDEO
        ===================================================== */

        .no-video {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: var(--light-green);
            color: var(--primary);

            text-align: center;
        }

        .no-video-icon {
            width: 64px;
            height: 64px;

            border-radius: 50%;
            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
            margin-bottom: 8px;
        }

        .no-video span {
            font-size: 12px;
            font-weight: 700;
        }

        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .video-content {
            padding: 17px;
        }

        .video-title {
            color: #212529;

            font-size: 17px;
            font-weight: 800;

            line-height: 1.35;
            margin-bottom: 7px;
        }

        .video-description {
            color: #6c757d;

            font-size: 12px;
            line-height: 1.5;

            margin-bottom: 14px;
        }

        /* =====================================================
           WATCH BUTTON
        ===================================================== */

        .watch-btn {
            width: 100%;

            border: 0;
            border-radius: 10px;

            background: var(--primary);
            color: #fff;

            padding: 12px;

            font-size: 13px;
            font-weight: 800;

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .watch-btn:hover {
            background: var(--primary-dark);
            color: #fff;
            transform: translateY(-1px);
        }

        .watch-btn:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            transform: none;
        }

        .unavailable-text {
            color: #dc3545;

            font-size: 11px;
            font-weight: 600;

            margin-top: 8px;
        }

        /* =====================================================
           IN-PAGE VIDEO PLAYER
        ===================================================== */

        .video-player-page {
            width: 100%;
            max-width: 1100px;

            margin: 30px auto;

            background: #000;

            border-radius: 16px;
            overflow: hidden;

            box-shadow: 0 12px 40px rgba(0,0,0,.18);
        }

        .player-topbar {
            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 10px 15px;

            background: #181818;
            color: #fff;
        }

        .player-back-button {
            flex: 0 0 auto;

            border: 0;
            border-radius: 8px;

            padding: 8px 13px;

            background: #2b2b2b;
            color: #fff;

            font-weight: 700;
            font-size: 13px;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;
        }

        .player-back-button:hover {
            background: #3b3b3b;
            transform: translateX(-2px);
        }

        .player-brand {
            color: #198754;
            font-size: 18px;
        }

        .player-container {
            width: 100%;
        }

        .player-frame {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;
        }

        .player-frame iframe {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;
            display: block;
        }

        .player-info {
            padding: 20px;

            background: #fff;
            color: #212529;

        /* =====================================================

            .player-topbar {
                padding: 9px 10px;
            }

            .player-back-button {
                padding: 7px 9px;
            }

            .player-brand {
                font-size: 16px;
            }

const selectedLesson = parseInt(
    params.get("lesson") || "-1",

);


/* ============================================================
   ELEMENTS
============================================================ */

const courseHeader =

const lessonsContainer =
    document.getElementById("lessonsContainer");

const messageArea =

const videoPlayerPage =
    document.getElementById("videoPlayerPage");

const lessonVideoFrame =
    document.getElementById("lessonVideoFrame");

const playerLessonTitle =
    document.getElementById("playerLessonTitle");

const playerCourseLabel =
    document.getElementById("playerCourseLabel");

const closeVideoPlayerButton =
    document.getElementById("closeVideoPlayer");

let videoPlayerReturnTarget = null;


/* ============================================================
   COURSE ACTIVATION
============================================================ */

function isCourseActivated(course) {

    try {

        const stored =
            localStorage.getItem(
                "feellk_activated_courses"
            );

        if (!stored) {
            return false;
        }

        const activated =
            JSON.parse(stored);

        if (Array.isArray(activated)) {

            return activated.some(item => {

                if (typeof item === "string") {

                    return (
                        item.toLowerCase() === course
                    );

                }

                if (
                    item &&
                    typeof item === "object"
                ) {

                    const itemCourse =
                        String(
                            item.course ||
                            item.courseId ||
                            item.id ||
                            ""
                        ).toLowerCase();

                    return itemCourse === course;

                }

                return false;

            });

        }

        if (
            activated &&
            typeof activated === "object"
        ) {

            return Boolean(
                activated[course]
            );

        }

    } catch (error) {

        console.error(
            "FeelLK activation error:",
            error
        );

    }

    return false;

}


/* ============================================================
   LEGACY ACTIVATION
============================================================ */

function hasLegacyActivation(course) {

    const possibleKeys = [

        `feellk_course_${course}`,
        `course_${course}`,
        `${course}_activated`,
        `activated_${course}`

    ];

    return possibleKeys.some(key => {

        const value =
            localStorage.getItem(key);

        return (
            value === "true" ||
            value === "1" ||
            value === course
        );

    });

}


/* ============================================================
   FINAL ACCESS CHECK
============================================================ */

function canOpenCourse(course) {

    return (
        isCourseActivated(course) ||
        hasLegacyActivation(course)
    );

}


/* ============================================================
   YOUTUBE VIDEO ID
============================================================ */

function extractYoutubeVideoId(url) {

    if (
        !url ||
        !url.trim()
    ) {

        return null;

    }

    try {

        const parsed =
            new URL(url);

        const host =
            parsed.hostname.toLowerCase();

        let videoId = null;


        /* youtu.be */

        if (
            host === "youtu.be" ||
            host === "www.youtu.be"
        ) {

            videoId =
                parsed.pathname
                    .split("/")
                    .filter(Boolean)[0];

        }


        /* youtube.com */

        else if (
            host === "youtube.com" ||
            host === "www.youtube.com" ||
            host.endsWith(".youtube.com")
        ) {

            videoId =
                parsed.searchParams.get("v");


            /* embed */

            if (
                !videoId &&
                parsed.pathname.startsWith("/embed/")
            ) {

                videoId =
                    parsed.pathname
                        .split("/")
                        .filter(Boolean)[1];

            }


            /* shorts */

            if (
                !videoId &&
                parsed.pathname.startsWith("/shorts/")
            ) {

                videoId =
                    parsed.pathname
                        .split("/")
                        .filter(Boolean)[1];

            }

        }


        if (
            !videoId ||
            !/^[A-Za-z0-9_-]{11}$/.test(videoId)
        ) {

            return null;

        }

        return videoId;

    } catch (error) {

        return null;

    }

}


/* ============================================================
   VIDEO START TIME
============================================================ */

function getVideoStartTime(url) {

    if (!url) {
        return 0;
    }

    try {

        const parsed =
            new URL(url);

        let time =
            parsed.searchParams.get("t");

        if (!time) {

            time =
                parsed.searchParams.get("start");

        }

        if (!time) {
            return 0;
        }


        /* t=90 */

        if (/^\d+$/.test(time)) {

            return parseInt(
                time,
                10
            );

        }


        /* t=1m30s */

        const match =
            time.match(
                /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/
            );

        if (
            match &&
            match[0]
        ) {

            const hours =
                parseInt(
                    match[1] || 0,
                    10
                );

            const minutes =
                parseInt(
                    match[2] || 0,
                    10
                );

            const seconds =
                parseInt(
                    match[3] || 0,
                    10
                );

            return (
                hours * 3600 +
                minutes * 60 +
                seconds
            );

        }

    } catch (error) {

        return 0;

    }

    return 0;

}


/* ============================================================
   YOUTUBE EMBED URL
============================================================ */

function createYoutubeEmbedUrl(url) {

    const videoId =
        extractYoutubeVideoId(url);

    if (!videoId) {
        return null;
    }

    const start =
        getVideoStartTime(url);

    const embedUrl = new URL(
        `https://www.youtube.com/embed/${videoId}`
    );

    embedUrl.searchParams.set("autoplay", "1");
    embedUrl.searchParams.set("controls", "1");
    embedUrl.searchParams.set("fs", "1");
    embedUrl.searchParams.set("rel", "0");
    embedUrl.searchParams.set("modestbranding", "1");
    embedUrl.searchParams.set("playsinline", "1");
    embedUrl.searchParams.set("enablejsapi", "1");

    if (start > 0) {
        embedUrl.searchParams.set("start", String(start));
    }

    if (window.location.origin !== "null") {
        embedUrl.searchParams.set("origin", window.location.origin);
    }

    return embedUrl.toString();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

============================================================ */

) {

/* ============================================================
   OPEN VIDEO
============================================================ */

function openVideo(index) {

    const lessons =
        CourseLessons[courseId];

    if (!lessons) {
        return;
    }

    const lesson =
        lessons[index];

    if (!lesson) {
        return;
    }


    if (
        !lesson.url ||
        !lesson.url.trim()
    ) {

        alert(
            "Casharkan wali YouTube link looma gelin."
        );

        return;

    }


    const embedUrl =
        createYoutubeEmbedUrl(
            lesson.url
        );

    if (!embedUrl) {

        alert(
            "This video is unavailable."
        );

        return;

    }


    videoPlayerReturnTarget =
        document.activeElement;


    playerLessonTitle.textContent =
        lesson.title;

    playerCourseLabel.textContent =
        CourseNames[courseId] ||
        "FeelLK Course";


    lessonVideoFrame.title =
        `${lesson.title} video`;


    /*
        Video-ga wuxuu ka furmayaa
        isla page-ka FeelLK.
    */

    lessonVideoFrame.src =
        embedUrl;


    courseHeader.classList.add(
        "d-none"
    );

    lessonsContainer.classList.add(
        "d-none"
    );

    messageArea.classList.add(
        "d-none"
    );


    videoPlayerPage.classList.remove(
        "d-none"
    );

    videoPlayerPage.setAttribute(
        "aria-hidden",
        "false"
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ============================================================
   CLOSE VIDEO PLAYER
============================================================ */

function closeVideoPlayer() {

    if (
        videoPlayerPage.classList.contains(
            "d-none"
        )
    ) {

        return;

    }


    /*
        about:blank wuxuu joojinayaa
        YouTube video-ga.
    */

    lessonVideoFrame.src =
        "about:blank";


    videoPlayerPage.classList.add(
        "d-none"
    );

    videoPlayerPage.setAttribute(
        "aria-hidden",
        "true"
    );


    courseHeader.classList.remove(
        "d-none"
    );

    lessonsContainer.classList.remove(
        "d-none"
    );

    messageArea.classList.remove(
        "d-none"
    );


    if (
        videoPlayerReturnTarget &&
        videoPlayerReturnTarget.isConnected
    ) {

        videoPlayerReturnTarget.focus({
            preventScroll: true
        });

    }


    videoPlayerReturnTarget =
        null;

}


closeVideoPlayerButton.addEventListener(
    "click",
    closeVideoPlayer
);


/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            !videoPlayerPage.classList.contains(
                "d-none"
            )
        ) {

            closeVideoPlayer();

        }

    }
);


/* ============================================================
   RENDER LESSONS
============================================================ */

                        <div class="lesson-number">
                            Cashar ${lessonNumber}
                        </div>

                            <div class="free-badge">

                            `

}


/* ============================================================
   DIRECT LESSON OPEN
============================================================ */

function openSelectedLesson() {

    if (
        Number.isInteger(selectedLesson) &&
        selectedLesson >= 0
    ) {

        const lessons =
            CourseLessons[courseId];

        if (
            lessons &&
            selectedLesson < lessons.length
        ) {

            const lesson =
                lessons[selectedLesson];

            if (
                lesson &&
                lesson.url &&
                extractYoutubeVideoId(
                    lesson.url
                )
            ) {

                setTimeout(
                    () => {

                        openVideo(
                            selectedLesson
                        );

                    },
                    500
                );

            }

        }

    }

}

   INITIALIZE
============================================================ */

function initializeLessonPage() {

    if (!courseId) {

        showMessage(
            "📚",
            "Course lama dooran",
            "Fadlan My Courses ka dooro koorso."
        );

        return;

    }


    /* INVALID COURSE */

    if (!CourseNames[courseId]) {

        showMessage(
            "⚠️",
            "Course lama helin",
            "Koorso aad dooratay lama helin."
        );

        return;

    }


    /* ACCESS CHECK */

    if (!canOpenCourse(courseId)) {

        showMessage(
            "🔒",
            "Course-ka waa xiran yahay",
            "Waxaad marka hore u baahan tahay inaad activate-gareyso koorsadan My Courses."
        );

        return;

    }


    /* SHOW COURSE */

    renderCourseHeader();

    renderLessons();

    openSelectedLesson();

}
